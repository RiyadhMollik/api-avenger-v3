input {
  # TCP input for JSON logs from services
  tcp {
    port => 5000
    codec => json
    type => "service-logs"
  }

  # UDP input for high-volume logs
  udp {
    port => 5000
    codec => json
    type => "service-logs"
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add service name from logger or message
  if [service] {
    mutate {
      add_field => { "service_name" => "%{service}" }
    }
  }

  # Parse log level
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # Add environment info
  mutate {
    add_field => {
      "environment" => "development"
      "platform" => "careforall"
    }
  }

  # Extract error information
  if [stack] {
    mutate {
      add_field => { "has_error" => "true" }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "careforall-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Debug output to console (can be removed in production)
  stdout {
    codec => rubydebug
  }
}
