<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - CareForAll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .warning-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ff9800;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out;
    }
    .warning-icon svg {
      width: 60px;
      height: 60px;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    h1 {
      color: #ff9800;
      font-size: 36px;
      margin-bottom: 15px;
    }
    .message {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .details {
      background: #fff8e1;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
      border: 1px solid #ffecb3;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ffecb3;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #666;
      font-weight: 500;
    }
    .detail-value {
      color: #333;
      font-weight: 600;
    }
    .info-box {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
      padding: 15px;
      margin-bottom: 30px;
      text-align: left;
      border-radius: 5px;
    }
    .info-box p {
      color: #666;
      margin: 0;
    }
    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      margin: 5px;
    }
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-retry {
      background: #ff9800;
    }
    .btn-retry:hover {
      background: #f57c00;
      box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="warning-icon">
      <svg viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="20" stroke="white" stroke-width="3" fill="none"/>
        <line x1="26" y1="16" x2="26" y2="30" stroke="white" stroke-width="3"/>
        <circle cx="26" cy="36" r="2" fill="white"/>
      </svg>
    </div>
    
    <h1>Payment Cancelled</h1>
    <p class="message">
      You have cancelled the payment process. No charges have been made.
    </p>
    
    <div class="info-box">
      <p>💡 Your donation was not processed. If you encountered any issues during payment, please try again or contact our support team.</p>
    </div>
    
    <div class="details">
      <div class="detail-row">
        <span class="detail-label">Transaction ID:</span>
        <span class="detail-value" id="transactionId">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status:</span>
        <span class="detail-value" style="color: #ff9800;">Cancelled</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date:</span>
        <span class="detail-value" id="date">-</span>
      </div>
    </div>
    
    <div>
      <a href="/" class="btn btn-retry">Try Again</a>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const transaction = urlParams.get('transaction');
    
    // Display payment details
    if (transaction) {
      document.getElementById('transactionId').textContent = transaction;
    }
    
    document.getElementById('date').textContent = new Date().toLocaleString();
    
    // Redirect to home after 15 seconds
    setTimeout(() => {
      window.location.href = '/';
    }, 15000);
  </script>
</body>
</html>
