<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Failed - CareForAll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .error-icon {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f44336;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out;
    }
    .error-icon svg {
      width: 60px;
      height: 60px;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: xmark 0.8s ease-out 0.3s forwards;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    @keyframes scaleIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    @keyframes xmark {
      to { stroke-dashoffset: 0; }
    }
    h1 {
      color: #f44336;
      font-size: 36px;
      margin-bottom: 15px;
    }
    .message {
      color: #666;
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .details {
      background: #fff3f3;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
      border: 1px solid #ffcdd2;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ffcdd2;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #666;
      font-weight: 500;
    }
    .detail-value {
      color: #333;
      font-weight: 600;
    }
    .reason {
      background: #ffebee;
      border-left: 4px solid #f44336;
      padding: 15px;
      margin-bottom: 30px;
      text-align: left;
      border-radius: 5px;
    }
    .reason strong {
      color: #f44336;
      display: block;
      margin-bottom: 5px;
    }
    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      margin: 5px;
    }
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-retry {
      background: #f44336;
    }
    .btn-retry:hover {
      background: #d32f2f;
      box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-icon">
      <svg viewBox="0 0 52 52">
        <line x1="16" y1="16" x2="36" y2="36"/>
        <line x1="36" y1="16" x2="16" y2="36"/>
      </svg>
    </div>
    
    <h1>Payment Failed</h1>
    <p class="message">
      We're sorry, but your payment could not be processed at this time.
    </p>
    
    <div class="reason" id="reasonBox" style="display: none;">
      <strong>Reason:</strong>
      <span id="reason">-</span>
    </div>
    
    <div class="details">
      <div class="detail-row">
        <span class="detail-label">Transaction ID:</span>
        <span class="detail-value" id="transactionId">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status:</span>
        <span class="detail-value" style="color: #f44336;">Failed</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date:</span>
        <span class="detail-value" id="date">-</span>
      </div>
    </div>
    
    <div>
      <a href="/" class="btn btn-retry">Try Again</a>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const transaction = urlParams.get('transaction');
    const reason = urlParams.get('reason');
    
    // Display payment details
    if (transaction) {
      document.getElementById('transactionId').textContent = transaction;
    }
    
    if (reason) {
      document.getElementById('reasonBox').style.display = 'block';
      const reasonText = decodeURIComponent(reason)
        .replace(/_/g, ' ')
        .replace(/\b\w/g, l => l.toUpperCase());
      document.getElementById('reason').textContent = reasonText;
    }
    
    document.getElementById('date').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
